<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        body {
            background-image: url("images/grass.png"), url("images/dirt.png");
            background-repeat: repeat-x, repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        h1, p, label {
            color: white;
        }

        .container {
            background: rgba(36, 41, 46, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #1e2227;
            color: white;
            box-sizing: border-box;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 10px 20px;
            background-color: #10b981;
            color: white;
            border-radius: 4px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #059669;
        }

        #error-msg {
            color: #f87171;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Loading View (prevents flashing the login screen if already logged in) -->
        <div id="loading-view">
            <h1>Authenticating...</h1>
        </div>

        <!-- Login Form View -->
        <div id="login-view" style="display: none;">
            <h1>Log In</h1>
            <p>Enter your account details to continue.</p>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="yourname@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-btn" class="btn">Log In</button>
            </form>

            <p id="error-msg"></p>
        </div>
    </div>
