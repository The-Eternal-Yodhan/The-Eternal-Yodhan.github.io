<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Home</title>
    <style>
        /* Your custom background rules */
        body {
            background-image: url("images/grass.png"), url("images/dirt.png");
            background-repeat: repeat-x, repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        /* Your custom text color rule */
        h1, h2, h3, h4, h5, h6, p {
            color: white;
        }

        /* Semi-transparent dark card wrapper to keep your text readable over images */
        .container {
            background: rgba(36, 41, 46, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            margin: auto;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #10b981; /* Green accent color */
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .logout-btn {
            background-color: #ef4444;
        }
        
        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- This header text changes based on login status -->
        <h1 id="welcome-title">Checking your login status...</h1>
        <p id="user-details"></p>
        
        <!-- This button area dynamically changes -->
        <div id="action-area"></div>
    </div>

    <script type="module">
        // Direct clean library import using the verified browser CDN link
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        // Wait until all resources and library elements are fully parsed by the browser
        window.addEventListener('DOMContentLoaded', () => {
            
            const SUPABASE_URL = 'https://whrslkfvubmqzzwotncs.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_eOO7o5ahzkX-wF3mh94ZvA_nV2-AEOf';
            const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

            // Grab DOM elements
            const welcomeTitle = document.getElementById('welcome-title');
            const userDetails = document.getElementById('user-details');
            const actionArea = document.getElementById('action-area');

            // Ask Supabase if a user is currently logged in right now
            async function checkUserSession() {
                try {
                    const { data: { user }, error } = await supabase.auth.getUser();

                    if (error) throw error;

                    if (user) {
                        // User IS logged in!
                        welcomeTitle.innerText = "Welcome back!";
                        userDetails.innerText = `You are securely logged in as: ${user.email}`;
                        
                        // Inject a logout button
                        actionArea.innerHTML = `<button id="logout-btn" class="btn logout-btn">Log Out</button>`;
                        
                        // Attach functional logout trigger
                        document.getElementById('logout-btn').addEventListener('click', async () => {
                            await supabase.auth.signOut();
                            alert("Logged out successfully!");
                            window.location.reload(); // Refresh to update screen state
                        });
                    } else {
                        // User is NOT logged in
                        welcomeTitle.innerText = "Welcome Guest";
                        userDetails.innerText = "Please log in to access your dashboard settings.";
                        
                        // Inject a link to your login page (log.html)
                        actionArea.innerHTML = `<a href="log.html" class="btn">Go to Login Page</a>`;
                    }
                } catch (e) {
                    // Fail-safe handling for network drops or empty states
                    welcomeTitle.innerText = "Welcome Guest";
                    userDetails.innerText = "Please log in to access your dashboard settings.";
                    actionArea.innerHTML = `<a href="log.html" class="btn">Go to Login Page</a>`;
                }
            }

            // Execute session query loop
            checkUserSession();
        });
    </script>
</body>
</html>
