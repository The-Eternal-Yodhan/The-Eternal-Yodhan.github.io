<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    
    <style>
        /* Your custom background style rules */
        body {
            background-image: url("images/grass.png"), url("images/dirt.png");
            background-repeat: repeat-x, repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Your custom text color override rules */
        h1, h2, h3, h4, h5, h6, p {
            color: white;
        }

        /* Login Card Layout Settings */
        .login-card {
            background: rgba(36, 41, 46, 0.95); /* Dark background so white text reads perfectly */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 360px;
        }
        h2 { margin-top: 0; text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #d1d5db; font-size: 14px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #4b5563;
            background-color: #1f2937; color: white;
            border-radius: 4px; box-sizing: border-box; font-size: 16px;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        button {
            width: 100%; padding: 12px; background-color: #10b981;
            color: white; border: none; border-radius: 4px;
            font-size: 16px; cursor: pointer; font-weight: 600;
        }
        button:disabled { background-color: #4b5563; }
        #error-msg {
            color: #ef4444; font-size: 14px; margin-top: 12px;
            text-align: center; display: none; background: #fee2e2;
            padding: 8px; border-radius: 4px; color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-btn">Log In</button>
            <p id="error-msg"></p>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://jsdelivr.net'

        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eOO7o5ahzkX-wF3mh94ZvA_nV2-AEOf';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); 
            
            submitBtn.innerText = 'Connecting...';
            submitBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: emailInput.value,
                    password: passwordInput.value,
                });

                if (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.style.display = 'block';
                } else {
                    alert('Success! Logging you in.');
                    // 1st change: Send the user straight to main.html
                    window.location.href = 'main.html'; 
                }
            } catch (err) {
                errorMsg.innerText = "Connection lost. Try again.";
                errorMsg.style.display = 'block';
            }

            submitBtn.innerText = 'Log In';
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
