<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        body {
            background-image: url("images/grass.png"), url("images/dirt.png");
            background-repeat: repeat-x, repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        h1, p, label {
            color: white;
        }

        .container {
            background: rgba(36, 41, 46, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #1e2227;
            color: white;
            box-sizing: border-box;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 10px 20px;
            background-color: #10b981;
            color: white;
            border-radius: 4px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #059669;
        }

        #error-msg {
            color: #f87171;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Form View is now the only thing here, visible immediately -->
        <div id="login-view">
            <h1>Log In</h1>
            <p>Enter your account details to continue.</p>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="yourname@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="login-btn" class="btn">Log In</button>
            </form>

            <p id="error-msg"></p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        window.addEventListener('DOMContentLoaded', () => {
            const SUPABASE_URL = 'https://whrslkfvubmqzzwotncs.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_eOO7o5ahzkX-wF3mh94ZvA_nV2-AEOf';
            
            // Initializing with session persistence turned on
            const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: { persistSession: true }
            });

            const authForm = document.getElementById('auth-form');
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            // Handle Login Form Submission
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.innerText = '';
                loginBtn.innerText = 'Logging in...';
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    errorMsg.innerText = error.message;
                    loginBtn.innerText = 'Log In'; // Reset button text on error
                } else {
                    // Success! Redirect to the main page immediately
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
